<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0c0f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="TRAINING OS"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>TRAINING OS BLACK</title><style>:root{--b:#0b0c0f;--p:#111317;--p2:#181b20;--l:#30343b;--t:#f4f6f8;--m:#9ca4ae;--g:#dfe8cf;--gt:#152014}*{box-sizing:border-box}html,body{margin:0;background:var(--b);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}body{padding-bottom:84px}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:30;background:#0b0c0fee;backdrop-filter:blur(14px);border-bottom:1px solid var(--l)}.head{max-width:920px;margin:auto;padding:14px 15px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950}.tag{font-size:11px;border:1px solid var(--l);padding:5px 8px;border-radius:999px;color:#cdd2d8}.wrap{max-width:920px;margin:auto;padding:12px}.page{display:none}.page.on{display:block}.card{background:linear-gradient(180deg,var(--p),#0e1013);border:1px solid var(--l);border-radius:18px;padding:16px;margin:10px 0}.hero h1{font-size:27px;margin:2px 0 7px}.muted{color:var(--m)}.small{font-size:12px}.tiny{font-size:11px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.day{background:#171a1f;border:1px solid var(--l);color:var(--t);padding:17px;border-radius:18px;text-align:left;min-height:112px}.day.rec{outline:2px solid #e6ebdd}.day .n{font-weight:1000;font-size:24px}.day b{display:block;margin-top:3px}.day .d{font-size:11px;color:var(--m);margin-top:6px;line-height:1.45}.btn{border:1px solid var(--l);background:#1b1f25;color:var(--t);padding:11px 13px;border-radius:12px;font-weight:850}.btn.pri{background:var(--g);color:var(--gt);border:0}.btn.red{background:#2b171b;color:#ffdce0}.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}.pill{display:inline-block;background:#252a31;border:1px solid var(--l);border-radius:999px;padding:5px 8px;font-size:11px}.tabs{position:fixed;left:0;right:0;bottom:0;background:#0b0c0ff5;border-top:1px solid var(--l);z-index:40;padding-bottom:env(safe-area-inset-bottom)}.tabin{max-width:920px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.tab{border:0;background:transparent;color:var(--m);padding:12px 3px;font-size:11px;font-weight:850}.tab.on{color:white}.ready{display:grid;grid-template-columns:1.15fr .85fr;gap:9px}.readymsg{background:var(--g);color:#12180f;border-radius:16px;padding:16px;display:grid;place-items:center;text-align:center;font-weight:950;line-height:1.45;min-height:120px}.rstack{display:grid;gap:7px}.rline{display:grid;grid-template-columns:.8fr 1.2fr;border:1px solid var(--l);border-radius:12px;overflow:hidden;background:#0d0f12}.rline>div:first-child{padding:10px;background:#13161a;font-weight:850}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:5px}.ch{border:1px solid #3a4048;background:#15181d;color:#cbd1d8;border-radius:9px;padding:7px 3px;font-size:10px;font-weight:800}.ch.on{background:var(--g);color:var(--gt);border-color:transparent}.sheet{border:1px solid var(--l);border-radius:15px;overflow:hidden;margin-top:11px;background:#0e1013}.sh,.sr{display:grid;grid-template-columns:2fr .5fr .7fr .75fr .8fr}.sh{background:#050607;font-weight:950}.sh div,.sr>div{padding:11px 8px;border-right:1px solid var(--l)}.sh div:last-child,.sr>div:last-child{border-right:0}.sr{border-top:1px solid var(--l);background:#191c21}.ename{font-weight:950}.emeta{font-size:10px;color:var(--m);margin-top:4px}.sets{border-top:1px solid var(--l);padding:9px;background:#101216}.set{display:grid;grid-template-columns:30px 1fr 1fr 1fr 40px;gap:6px;align-items:end;margin-top:6px}.set:first-child{margin-top:0}.sn,.ok{height:38px;border-radius:10px;border:1px solid #363b43;background:#1c2026;color:#d8dde3;display:grid;place-items:center;font-weight:950}.set.done .sn,.set.done .ok{background:var(--g);color:var(--gt);border-color:transparent}label{display:block;font-size:10px;color:var(--m);margin-bottom:3px}input,select,textarea{width:100%;background:#0e1014;border:1px solid #363b43;color:var(--t);border-radius:10px;padding:9px}.timer{position:sticky;top:55px;z-index:25;background:#11161c;border:1px solid #414b56;border-radius:14px;padding:10px;margin:9px 0;display:flex;justify-content:space-between;align-items:center}.clock{font-size:24px;font-weight:1000}.hide{display:none!important}.hist{border-top:1px solid var(--l);padding:11px 0}.hist:first-child{border-top:0}.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#eef3e6;color:#172114;padding:8px 13px;border-radius:999px;font-weight:900;opacity:0;z-index:80;transition:.2s}.toast.on{opacity:1}@media(max-width:680px){.grid3{grid-template-columns:1fr}.ready{grid-template-columns:1fr}.sh,.sr{grid-template-columns:1.45fr .45fr .6fr .7fr .7fr;font-size:11px}.sh div,.sr>div{padding:9px 5px}}@media(max-width:430px){.wrap{padding:9px}.set{grid-template-columns:28px 1fr 1fr 1fr 37px}}</style></head><body><div class="top"><div class="head"><div class="brand">TRAINING OS <span style="opacity:.55">BLACK</span></div><div class="tag">PRIVATE WORKOUT</div></div></div><main class="wrap"><section id="home" class="page on"><div class="card hero"><div class="muted small">평생 반복형 · 자동 중량 추천</div><h1>오늘 운동을 선택하세요</h1><div class="muted small">1 → 2 → 3 순서로 반복. 지난 기록을 바탕으로 다음 무게와 목표 횟수를 자동 계산합니다.</div></div><div class="grid3" id="days"></div><div class="card"><div class="row between"><b>다음 추천</b><span class="pill" id="nextpill"></span></div><div id="preview"></div></div></section><section id="work" class="page"><div id="empty" class="card"><b>진행 중 운동 없음</b><div class="muted small" style="margin-top:5px">홈에서 일차를 선택하세요.</div></div><div id="active" class="hide"><div class="card"><div class="row between"><div><div class="muted tiny">진행 중</div><h2 id="wtitle" style="margin:2px 0 8px"></h2></div><button class="btn" onclick="cancelW()">취소</button></div><div class="ready"><div id="rmsg" class="readymsg"></div><div class="rstack"><div class="rline"><div>컨디션</div><div class="choices" id="energy"></div></div><div class="rline"><div>수면</div><div class="choices" id="sleep"></div></div><div class="rline"><div>활동량</div><div class="choices" id="activity"></div></div><div class="rline"><div>근육피로</div><div class="choices" id="fatigue"></div></div></div></div><div id="timer" class="timer hide"><div><div class="muted tiny">쉬는시간</div><div id="clock" class="clock">01:30</div></div><div class="row"><button class="btn" onclick="addT(30)">+30초</button><button class="btn red" onclick="stopT()">정지</button></div></div><div id="exlist"></div><div style="height:10px"></div><label>오늘 메모</label><textarea id="note" rows="3"></textarea><div style="height:8px"></div><button class="btn pri" style="width:100%" onclick="finish()">오늘 운동 저장 완료</button></div></div></section><section id="history" class="page"><div class="card"><div class="row between"><b>운동 기록</b><button class="btn" onclick="clearH()">전체 삭제</button></div><div id="hist"></div></div></section><section id="settings" class="page"><div class="card"><b>설정</b><div style="height:10px"></div><label>기본 머신 증량 단위(kg)</label><input id="step" type="number" step=".5" min=".5"><div style="height:8px"></div><button class="btn pri" onclick="saveSet()">저장</button></div><div class="card"><b>아이폰에 설치</b><p class="muted small">Safari에서 공유 버튼 → <b>홈 화면에 추가</b>. 설치 후 앱처럼 전체화면으로 열립니다. 기록은 이 폰의 브라우저 저장공간에 보관됩니다.</p></div></section></main><nav class="tabs"><div class="tabin"><button class="tab on" data-p="home" onclick="go('home')">홈</button><button class="tab" data-p="work" onclick="go('work')">운동</button><button class="tab" data-p="history" onclick="go('history')">기록</button><button class="tab" data-p="settings" onclick="go('settings')">설정</button></div></nav><div id="toast" class="toast">저장됨</div><script>const K='training_os_black_live_v1';const D=[{n:'1일차',t:'상체 A',e:[['체스트프레스 머신',3,8,10,150],['랫 풀 다운',3,8,10,120],['숄더프레스 머신',3,10,12,120],['시티드 케이블로우',3,10,12,120],['인클라인 프레스 머신',3,10,12,90],['사이드 레터럴 레이즈 머신',3,12,15,90],['페이스풀',3,12,15,90],['프리쳐컬',3,12,15,90],['케이블 푸쉬다운',3,12,15,90]]},{n:'2일차',t:'하체 A',e:[['스쿼트머신',3,8,10,150],['레그프레스',3,10,12,120],['힙 쓰러스터 머신',2,10,12,90],['루마니안 데드리프트',2,10,12,120],['레그익스텐션',2,12,15,90],['레그컬',2,12,15,90],['카프레이즈',3,12,20,75]]},{n:'3일차',t:'상체 B',e:[['숄더프레스 머신',3,8,10,120],['로우 머신',3,8,10,120],['인클라인 프레스 머신',3,8,10,120],['랫 풀 다운',2,10,12,90],['체스트 플라이머신',2,10,12,90],['사이드 레터럴 레이즈 머신',3,12,15,75],['리어 델트 플라이',3,12,15,75],['프리쳐컬',2,12,15,90],['케이블 푸쉬다운',2,12,15,90]]}];let db=load(),cur=null,ti=null,left=0;function load(){try{return Object.assign({h:[],next:0,step:5},JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){return{h:[],next:0,step:5}}}function save(){localStorage.setItem(K,JSON.stringify(db))}function toastx(s){toast.textContent=s;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),1200)}function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===p));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.p===p));if(p==='home')home();if(p==='history')renderH()}function score(){return cur.energy+cur.sleep+cur.activity+cur.fatigue}function mult(){let s=score();return s>=11?1.05:s>=7?1:.9}function rtext(){let s=score();return s>=11?'✨ 최상의 컨디션입니다!<br>목표 무게를 5% 상향합니다.':s>=7?'🙂 컨디션이 무난합니다.<br>계획 무게로 진행합니다.':'😵 피로도가 높습니다.<br>목표 무게를 10% 낮춥니다.'}function lastEx(name){for(let i=db.h.length-1;i>=0;i--){let e=db.h[i].e.find(x=>x.n===name);if(e)return e}return null}function round(v){let s=Number(db.step)||5;return Math.round(v/s)*s}function rx(name,sets,min,max){let e=lastEx(name);if(!e)return{w:'',tg:Array(sets).fill(min),why:'첫 기록: 목표 반복수에서 1~2회 여유 있는 무게로 시작'};let ss=e.s.filter(x=>x.w&&x.r);if(!ss.length)return{w:'',tg:Array(sets).fill(min),why:'지난 유효 기록 없음'};let w=Math.max(...ss.map(x=>x.w)),ws=ss.filter(x=>x.w===w),avg=ws.reduce((a,x)=>a+(x.p||8),0)/ws.length,top=ws.every(x=>x.r>=max),below=ws.some(x=>x.r<min),tg=ws.map(x=>x.r),why='';if(top&&avg<=8.5){w=round(w+db.step);tg=Array(sets).fill(min);why='상단 반복수 달성 → 한 단계 증량'}else if(below||avg>=9.5){w=round(w*.95);tg=Array(sets).fill(min);why='최소 반복수 미달/RPE 과다 → 약 5% 감량'}else{while(tg.length<sets)tg.push(min);let j=tg.findIndex(x=>x<max);if(j<0)j=0;tg[j]=Math.min(max,tg[j]+1);why='중량 유지 → 총 반복수 +1 목표'}w=round(w*mult());return{w,tg,why}}function home(){days.innerHTML='';D.forEach((d,i)=>{let b=document.createElement('button');b.className='day'+(i===db.next?' rec':'');b.innerHTML='<div class="n">'+d.n+'</div><b>'+d.t+'</b><div class="d">'+d.e.slice(0,4).map(x=>x[0]).join(' · ')+' 외</div>';b.onclick=()=>start(i);days.appendChild(b)});nextpill.textContent='추천 '+D[db.next].n;preview.innerHTML='';D[db.next].e.slice(0,5).forEach(x=>{let q=rx(x[0],x[1],x[2],x[3]),z=document.createElement('div');z.className='hist';z.innerHTML='<div class="row between"><b>'+x[0]+'</b><span class="pill">'+(q.w?q.w+'kg':'첫 기록')+'</span></div><div class="muted tiny">'+x[1]+'세트 · '+x[2]+'~'+x[3]+'회</div>';preview.appendChild(z)})}function choices(id,key,arr){let el=document.getElementById(id);el.innerHTML='';arr.forEach((x,i)=>{let v=i+1,b=document.createElement('button');b.className='ch'+(cur[key]===v?' on':'');b.textContent=x;b.onclick=()=>{cur[key]=v;ready();renderEx()};el.appendChild(b)})}function ready(){rmsg.innerHTML=rtext();choices('energy','energy',['낮음','보통','좋음']);choices('sleep','sleep',['부족','보통','충분']);choices('activity','activity',['많음','보통','적음']);choices('fatigue','fatigue',['심함','보통','개운'])}function start(i){cur={i,energy:2,sleep:2,activity:2,fatigue:2};empty.classList.add('hide');active.classList.remove('hide');wtitle.textContent=D[i].n+' · '+D[i].t;ready();renderEx();go('work')}function renderEx(){if(!cur)return;exlist.innerHTML='';D[cur.i].e.forEach(x=>{let[name,sets,min,max,rest]=x,q=rx(name,sets,min,max),s=document.createElement('div');s.className='sheet';s.dataset.name=name;s.dataset.min=min;s.dataset.max=max;s.innerHTML='<div class="sh"><div>운동종목</div><div>세트</div><div>횟수</div><div>추천무게</div><div>쉬는시간</div></div><div class="sr"><div><div class="ename">'+name+'</div><div class="emeta">'+q.why+'</div></div><div>'+sets+'</div><div>'+min+'~'+max+'</div><div><b>'+(q.w?q.w+'kg':'-')+'</b></div><div>'+sec(rest)+'</div></div>';for(let j=0;j<sets;j++){let t=q.tg[j]||min,b=document.createElement('div');b.className='sets';b.innerHTML='<div class="set"><div class="sn">'+(j+1)+'</div><div><label>실제 kg</label><input class="w" type="number" inputmode="decimal" step=".5" value="'+(q.w||'')+'"></div><div><label>실제 횟수 · 목표 '+t+'</label><input class="r" type="number" inputmode="numeric" placeholder="'+t+'"></div><div><label>RPE · 목표 8</label><input class="p" type="number" inputmode="decimal" step=".5" placeholder="8"></div><button class="ok" onclick="done(this,'+rest+')">✓</button></div>';s.appendChild(b)}exlist.appendChild(s)})}function done(b,r){let row=b.closest('.set'),w=+row.querySelector('.w').value,n=+row.querySelector('.r').value;if(!w||!n){toastx('kg와 횟수를 입력');return}row.classList.toggle('done');if(row.classList.contains('done'))startT(r)}function sec(x){return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')}function startT(s){stopT(false);left=s;timer.classList.remove('hide');draw();ti=setInterval(()=>{left--;draw();if(left<=0){stopT();navigator.vibrate?.([150,80,150]);toastx('휴식 종료')}},1000)}function addT(s){left+=s;draw()}function draw(){clock.textContent=sec(left)}function stopT(h=true){if(ti)clearInterval(ti);ti=null;if(h)timer.classList.add('hide')}function cancelW(){if(confirm('운동을 취소할까요?')){cur=null;active.classList.add('hide');empty.classList.remove('hide');stopT();go('home')}}function finish(){let E=[];document.querySelectorAll('#exlist .sheet').forEach(s=>{let a=[];s.querySelectorAll('.set').forEach(r=>{let w=+r.querySelector('.w').value,n=+r.querySelector('.r').value,p=+r.querySelector('.p').value||null;if(w&&n)a.push({w,r:n,p})});if(a.length)E.push({n:s.dataset.name,s:a})});if(!E.length){alert('최소 한 세트를 입력하세요.');return}db.h.push({d:new Date().toISOString(),day:cur.i,score:score(),e:E,note:note.value});db.next=(cur.i+1)%3;save();cur=null;note.value='';active.classList.add('hide');empty.classList.remove('hide');stopT();go('home');toastx('저장 완료 · 다음 추천 계산됨')}function renderH(){hist.innerHTML='';if(!db.h.length){hist.innerHTML='<div class="muted small" style="margin-top:10px">아직 기록이 없습니다.</div>';return}[...db.h].reverse().forEach(h=>{let z=document.createElement('div');z.className='hist';z.innerHTML='<b>'+D[h.day].n+' · '+D[h.day].t+'</b><div class="muted tiny">'+new Date(h.d).toLocaleString('ko-KR')+' · 준비도 '+h.score+'점</div>'+h.e.map(e=>'<div class="small" style="margin-top:7px"><b>'+e.n+'</b><br>'+e.s.map((s,i)=>(i+1)+'세트 '+s.w+'kg × '+s.r+'회'+(s.p?' @RPE'+s.p:'')).join('<br>')+'</div>').join('');hist.appendChild(z)})}function clearH(){if(confirm('전체 기록을 삭제할까요?')){db.h=[];db.next=0;save();renderH();home()}}function saveSet(){db.step=+step.value||5;save();toastx('설정 저장')}step.value=db.step;home();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
