<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Folio — 내 포트폴리오</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

<style>
:root {
  --bg:#faf7f4;--bg2:#f3ede6;--bg3:#ebe1d6;
  --card:#ffffff;--border:#ddd0c0;--border2:#c9b89e;
  --text:#2c1f0e;--text2:#5c4530;--text3:#8c6d50;
  --accent:#8b5e3c;--accent2:#a67c52;--accent-light:#f0e6d8;
  --up:#c0392b;--up-bg:#fdecea;--down:#2471a3;--down-bg:#eaf3fb;
  --gold:#b8860b;--gold-bg:#fdf8e1;
  --shadow:0 2px 12px rgba(139,94,60,0.08);
  --shadow2:0 4px 24px rgba(139,94,60,0.14);
  --r:14px;--rsm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-tap-highlight-color:transparent;}

/* NAV */
.nav{background:var(--card);border-bottom:1.5px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(139,94,60,0.07);}
.nav-top{display:flex;align-items:center;padding:0 16px;height:54px;gap:12px;}
.nav-logo{font-family:'DM Serif Display',serif;font-size:20px;color:var(--accent);flex-shrink:0;}
.nav-spacer{flex:1;}
.nav-time{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text3);}
.nav-tabs{display:flex;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--border);padding:0 8px;}
.nav-tabs::-webkit-scrollbar{display:none;}
.nav-tab{padding:9px 14px;font-size:12px;font-weight:600;color:var(--text3);white-space:nowrap;cursor:pointer;border:none;background:none;border-bottom:2.5px solid transparent;transition:all .15s;}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.nav-tab:hover{color:var(--accent2);}

/* MARKET TICKER BAR */
.market-bar{background:var(--bg2);border-bottom:1px solid var(--border);overflow:hidden;height:32px;display:flex;align-items:center;}
.market-scroll{display:flex;gap:0;animation:scroll-x 60s linear infinite;white-space:nowrap;}
.market-scroll:hover{animation-play-state:paused;}
@keyframes scroll-x{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.market-item{display:inline-flex;align-items:center;gap:6px;padding:0 16px;font-size:11px;border-right:1px solid var(--border);}
.market-name{color:var(--text3);font-weight:600;}
.market-val{font-family:'JetBrains Mono',monospace;font-weight:600;}
.market-chg{font-size:10px;font-family:'JetBrains Mono',monospace;}

/* LAYOUT */
.page{padding:16px;max-width:1200px;margin:0 auto;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr}.page{padding:10px}}

/* CARDS */
.card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);}
.card-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;}
.card-value{font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace;line-height:1.1;}
.card-sub{font-size:11px;color:var(--text3);margin-top:3px;}
.badge{display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;font-family:'JetBrains Mono',monospace;}
.badge-up{background:var(--up-bg);color:var(--up);}
.badge-down{background:var(--down-bg);color:var(--down);}
.badge-neu{background:var(--bg2);color:var(--text3);}

/* BTN */
.btn{padding:7px 13px;border-radius:var(--rsm);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:'Noto Sans KR',sans-serif;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--text2);}
.btn-secondary{background:var(--accent-light);color:var(--accent);border:1.5px solid var(--border2);}
.btn-danger{background:var(--up-bg);color:var(--up);border:1.5px solid #f5c6c2;}
.btn-sm{padding:4px 9px;font-size:11px;}
.btn-icon{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;}

/* TABLE */
.tbl-wrap{overflow-x:auto;border-radius:var(--rsm);}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{background:var(--bg2);color:var(--text3);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:7px 10px;text-align:left;border-bottom:1.5px solid var(--border);white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--bg2);}
.mono{font-family:'JetBrains Mono',monospace;}

/* FORM */
.form-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.form-group{display:flex;flex-direction:column;gap:3px;flex:1;min-width:110px;}
label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;}
input,select,textarea{border:1.5px solid var(--border);border-radius:var(--rsm);padding:8px 10px;font-size:13px;background:var(--card);color:var(--text);font-family:'Noto Sans KR',sans-serif;transition:border-color .15s;width:100%;}
input:focus,select:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 3px rgba(139,94,60,.08);}
.input-wrap{position:relative;}
.input-suffix{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--text3);pointer-events:none;}
.autocomplete-box{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1.5px solid var(--border2);border-top:none;border-radius:0 0 var(--rsm) var(--rsm);z-index:50;max-height:200px;overflow-y:auto;box-shadow:var(--shadow2);}
.autocomplete-item{padding:8px 10px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--border);}
.autocomplete-item:hover{background:var(--accent-light);}
.autocomplete-item:last-child{border-bottom:none;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(44,31,14,.45);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:var(--card);border-radius:var(--r);padding:20px;width:100%;max-width:500px;border:1.5px solid var(--border);box-shadow:var(--shadow2);max-height:90vh;overflow-y:auto;}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;}

/* SUMMARY STRIP */
.strip{background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);border-radius:var(--r);padding:16px 18px;color:#fff;display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
.strip-item{flex:1;min-width:90px;}
.strip-label{font-size:9px;opacity:.75;text-transform:uppercase;letter-spacing:.8px;margin-bottom:2px;}
.strip-val{font-size:17px;font-weight:700;font-family:'JetBrains Mono',monospace;}
.strip-sub{font-size:10px;opacity:.8;margin-top:1px;}

/* DONUT */
.donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.legend{display:flex;flex-direction:column;gap:5px;flex:1;min-width:100px;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* TYPE BADGE */
.type{display:inline-block;font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;text-transform:uppercase;letter-spacing:.4px;}
.type-stock-kr{background:#fff3e0;color:#e65100;}
.type-stock-us{background:#e3f2fd;color:#1565c0;}
.type-etf{background:#f3e5f5;color:#6a1b9a;}
.type-crypto{background:#fff8e1;color:#f57f17;}

/* PROGRESS */
.prog-wrap{background:var(--bg2);border-radius:99px;height:5px;flex:1;overflow:hidden;}
.prog-fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1);}

/* SPLIT ROW */
.split-row{display:grid;grid-template-columns:24px 1fr 1fr 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:11px;}
.split-row:last-child{border-bottom:none;}
.split-num{width:22px;height:22px;background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;}

/* UPLOAD */
.upload-area{border:2px dashed var(--border2);border-radius:var(--r);padding:28px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg2);}
.upload-area:hover,.upload-area.drag{border-color:var(--accent);background:var(--accent-light);}

/* MARKET DETAIL GRID */
.market-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}
.market-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--rsm);padding:12px;}
.market-card-name{font-size:10px;font-weight:700;color:var(--text3);margin-bottom:4px;}
.market-card-val{font-size:16px;font-weight:700;font-family:'JetBrains Mono',monospace;}

/* INNER TABS */
.itabs{display:flex;gap:3px;margin-bottom:14px;background:var(--bg2);padding:4px;border-radius:10px;}
.itab{flex:1;padding:6px;border-radius:7px;text-align:center;font-size:11px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--text3);transition:all .15s;}
.itab.active{background:var(--card);color:var(--accent);box-shadow:var(--shadow);}

/* HISTORY BADGE */
.hbadge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700;}
.hbuy{background:var(--up-bg);color:var(--up);}
.hsell{background:var(--down-bg);color:var(--down);}
.hdeposit{background:var(--gold-bg);color:var(--gold);}

/* UTIL */
.mt8{margin-top:8px;}.mt14{margin-top:14px;}.mb14{margin-bottom:14px;}
.flex{display:flex;align-items:center;}.flexb{display:flex;align-items:center;justify-content:space-between;}
.gap8{gap:8px;}.w100{width:100%;}.tr{text-align:right;}.tc{text-align:center;}
.up{color:var(--up);font-weight:600;}.down{color:var(--down);font-weight:600;}
.spin{display:inline-block;animation:spin .8s linear infinite;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.ticker-chip{display:inline-flex;align-items:center;background:var(--bg2);border:1px solid var(--border);border-radius:5px;padding:2px 6px;font-size:11px;font-family:'JetBrains Mono',monospace;font-weight:700;}
.section-title{font-size:14px;font-weight:700;color:var(--text);}
.loading-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse .8s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
</style>
</head>

// ── Yahoo Finance API (무료, 프록시 사용) ──────────────
async function fetchYahooPrice(ticker){
  try{
    const url=`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=1d`;
    const proxy=`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
    const res=await fetch(proxy,{signal:AbortSignal.timeout(8000)});
    const data=await res.json();
    const meta=data?.chart?.result?.[0]?.meta;
    if(!meta)return null;
    return{
      price:meta.regularMarketPrice||meta.previousClose,
      prev:meta.previousClose||meta.chartPreviousClose,
      currency:meta.currency||'USD',
      exchange:meta.exchangeName||'',
    };
  }catch{return null;}
}

async function fetchMultiplePrices(tickers){
  const results={};
  await Promise.allSettled(tickers.map(async t=>{
    const r=await fetchYahooPrice(t);
    if(r)results[t]=r;
  }));
  return results;
}

// ── 도넛 차트 ──────────────────────────────────────
function DonutChart({segments,size=130}){
  const r=50,cx=70,cy=70,circ=2*Math.PI*r;
  let cum=0;
  return(
    <svg width={size} height={size} viewBox="0 0 140 140">
      {segments.map((s,i)=>{
        const dash=(s.pct/100)*circ;
        const off=-(cum/100)*circ+circ*0.25;
        cum+=s.pct;
        return<circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={s.color} strokeWidth="22"
          strokeDasharray={`${dash} ${circ-dash}`} strokeDashoffset={off} style={{transition:'stroke-dasharray .6s'}}/>;
      })}
      <circle cx={cx} cy={cy} r={39} fill="white"/>
      <text x={cx} y={cy-4} textAnchor="middle" fontSize="11" fill="#8c6d50" fontWeight="700">{segments.length}</text>
      <text x={cx} y={cy+10} textAnchor="middle" fontSize="9" fill="#8c6d50">종목</text>
    </svg>
  );
}

function Modal({title,onClose,children}){
  useEffect(()=>{document.body.style.overflow='hidden';return()=>{document.body.style.overflow='';};},[]);
  return(
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="flexb mb14">
          <div className="modal-title">{title}</div>
          <button className="btn btn-secondary btn-sm" onClick={onClose}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

// ── 티커 자동완성 인풋 ──────────────────────────────
function TickerInput({value,onChange,onSelect}){
  const [open,setOpen]=useState(false);
  const ref=useRef();
  const suggestions=useMemo(()=>{
    if(!value||value.length<1)return[];
    const q=value.toUpperCase();
    return Object.entries(TICKER_DB).filter(([k,v])=>k.startsWith(q)||v.name.includes(value)).slice(0,8);
  },[value]);
  useEffect(()=>{
    const handler=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener('mousedown',handler);
    return()=>document.removeEventListener('mousedown',handler);
  },[]);
  return(
    <div className="input-wrap" ref={ref}>
      <input value={value} onChange={e=>{onChange(e.target.value.toUpperCase());setOpen(true);}} onFocus={()=>setOpen(true)} placeholder="AAPL, 005930, BTC..."/>
      {open&&suggestions.length>0&&(
        <div className="autocomplete-box">
          {suggestions.map(([k,v])=>(
            <div key={k} className="autocomplete-item" onClick={()=>{onSelect(k,v);setOpen(false);}}>
              <span style={{fontFamily:'JetBrains Mono',fontWeight:700,color:'var(--accent)'}}>{k}</span>
              <span style={{margin:'0 8px',color:'var(--text2)'}}>{v.name}</span>
              <span className={`type type-${v.type}`} style={{fontSize:9}}>{v.type==='stock-kr'?'KR':v.type==='stock-us'?'US':v.type.toUpperCase()}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

    const p=prices[h.ticker];

    const qty=h.investAmount/h.avgCost;
    const curVal=curPrice*qty;
    const pnl=curVal-h.investAmount;
    const pnlPct=(pnl/h.investAmount)*100;
    return{...h,curPrice,qty,curVal,pnl,pnlPct};
  }),[holdings,prices]);

          <div className="strip-label">보유종목</div>

      </div>

      <div className="g4 mb14">

          {label:'손실 종목',val:rows.filter(r=>r.pnl<0).length+'개',cls:'down'},

    const total=holdings.reduce((s,h)=>{
      const p=prices[h.ticker]?.price||h.avgCost;
      const qty=h.investAmount/h.avgCost;
      return s+p*qty;
    },0);
    return holdings.map(h=>{
      const curPrice=prices[h.ticker]?.price||h.avgCost;
      const qty=h.investAmount/h.avgCost;
      const curVal=curPrice*qty;
      const pnl=curVal-h.investAmount;
      const pnlPct=(pnl/h.investAmount)*100;
      const realPct=(curVal/total)*100;

      const chg=prices[h.ticker]?((prices[h.ticker].price-prices[h.ticker].prev)/prices[h.ticker].prev*100):null;
      return{...h,curPrice,qty,curVal,pnl,pnlPct,realPct,diff,chg,total};

                      <td className="tr"><span className={`badge ${r.pnlPct>=0?'badge-up':'badge-down'}`}>{fmtPct(r.pnlPct)}</span></td>
                      <td className="tr mono">{r.realPct.toFixed(1)}%</td>
                      <td className="tr mono">{r.targetPct}%</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        );
      })}

      {showModal&&(
        <Modal title={editItem?'종목 수정':'종목 추가'} onClose={()=>setShowModal(false)}>
          <div className="form-row">
            <div className="form-group" style={{flex:2}}>
              <label>티커 입력 (자동완성)</label>
              <TickerInput value={form.ticker} onChange={v=>setForm(f=>({...f,ticker:v}))} onSelect={handleTickerSelect}/>
            </div>
            <div className="form-group">
              <label>종류</label>
              <select value={form.type} onChange={e=>setForm(f=>({...f,type:e.target.value}))}>
                <option value="stock-kr">국내주식</option>
                <option value="stock-us">해외주식</option>
                <option value="etf">ETF</option>
                <option value="crypto">암호화폐</option>
              </select>
            </div>
          </div>
          <div className="form-row">
            <div className="form-group">
              <label>종목명</label>
              <input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="자동 입력됨"/>
            </div>
            <div className="form-group">
              <label>섹터/자산군</label>
              <input value={form.sector} onChange={e=>setForm(f=>({...f,sector:e.target.value}))} placeholder="미국주식"/>
            </div>
          </div>
          <div className="form-row">
            <div className="form-group">
              <label>투자 금액 (₩)</label>
              <div className="input-wrap">
                <input type="number" value={form.investAmount} onChange={e=>setForm(f=>({...f,investAmount:e.target.value}))} placeholder="5000000"/>
                <span className="input-suffix">원</span>
              </div>
            </div>
            <div className="form-group">
              <label>평균단가 (₩) {priceLoading&&<span className="loading-dot"/>}</label>
              <div className="input-wrap">
                <input type="number" value={form.avgCost} onChange={e=>setForm(f=>({...f,avgCost:e.target.value}))} placeholder="자동 조회됨"/>
                <span className="input-suffix">원</span>
              </div>
            </div>
            <div className="form-group">
              <label>목표비중 (%)</label>
              <div className="input-wrap">
                <input type="number" value={form.targetPct} onChange={e=>setForm(f=>({...f,targetPct:e.target.value}))} placeholder="20"/>
                <span className="input-suffix">%</span>
              </div>
            </div>
          </div>
          {form.investAmount&&form.avgCost&&(
            <div style={{background:'var(--accent-light)',borderRadius:8,padding:'8px 12px',fontSize:12,color:'var(--accent)',marginBottom:10}}>
              예상 보유수량: <strong>{(parseFloat(form.investAmount)/parseFloat(form.avgCost)).toFixed(4)}</strong>주
            </div>
          )}
          <div className="flex gap8">
            <button className="btn btn-primary w100" onClick={saveItem}>{editItem?'저장':'추가'}</button>
            <button className="btn btn-secondary" onClick={()=>setShowModal(false)}>취소</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// 분할 계획
// ════════════════════════════════════════════════════
function SplitPlan({holdings,prices}){
  const [form,setForm]=useState({ticker:'',mode:'buy',totalAmount:'',startDate:'2026-03-19',endDate:'2026-09-10',splits:'6'});
  const [plan,setPlan]=useState(null);

  const rows=useMemo(()=>{
    const total=holdings.reduce((s,h)=>{
      const p=prices[h.ticker]?.price||h.avgCost;
      return s+(p*(h.investAmount/h.avgCost));
    },0);
    return holdings.map(h=>{
      const curPrice=prices[h.ticker]?.price||h.avgCost;
      const qty=h.investAmount/h.avgCost;
      const curVal=curPrice*qty;
      const realPct=(curVal/total)*100;
      return{...h,curPrice,curVal,realPct,diff:realPct-h.targetPct};
    });
  },[holdings,prices]);

  const calc=()=>{
    if(!form.totalAmount||!form.startDate||!form.endDate||!form.splits)return;
    const count=parseInt(form.splits);
    const dates=datesBetween(form.startDate,form.endDate,count);
    const amtEach=Math.round(parseFloat(form.totalAmount)/count);
    const h=rows.find(x=>x.ticker===form.ticker);
    const curPrice=h?h.curPrice:0;
    const planRows=dates.map((d,i)=>({n:i+1,date:d,amount:amtEach,estQty:curPrice?(amtEach/curPrice).toFixed(4):'-',note:`${form.mode==='buy'?'매수':'매도'} ${i+1}/${count}`}));
    setPlan({rows:planRows,total:amtEach*count,count,amtEach,mode:form.mode,ticker:form.ticker});
  };

  return(
    <div className="page">
      <div className="g2">
        <div>
          <div className="card mb14">
            <div className="section-title mb14">분할 계획 설정</div>
            <div className="form-row">
              <div className="form-group">
                <label>구분</label>
                <select value={form.mode} onChange={e=>setForm(f=>({...f,mode:e.target.value}))}>
                  <option value="buy">분할매수</option>
                  <option value="sell">분할매도</option>
                </select>
              </div>
              <div className="form-group">
                <label>종목</label>
                <select value={form.ticker} onChange={e=>setForm(f=>({...f,ticker:e.target.value}))}>
                  <option value="">전체/현금</option>
                  {holdings.map(h=><option key={h.ticker} value={h.ticker}>{h.ticker} {h.name}</option>)}
                </select>
              </div>
            </div>
            <div className="form-row">
              <div className="form-group"><label>시작일</label><input type="date" value={form.startDate} onChange={e=>setForm(f=>({...f,startDate:e.target.value}))}/></div>
              <div className="form-group"><label>종료일</label><input type="date" value={form.endDate} onChange={e=>setForm(f=>({...f,endDate:e.target.value}))}/></div>
            </div>
            <div className="form-row">
              <div className="form-group">
                <label>총 금액 (₩)</label>
                <div className="input-wrap"><input type="number" value={form.totalAmount} onChange={e=>setForm(f=>({...f,totalAmount:e.target.value}))} placeholder="5000000"/><span className="input-suffix">원</span></div>
              </div>
              <div className="form-group"><label>분할 횟수</label><input type="number" value={form.splits} onChange={e=>setForm(f=>({...f,splits:e.target.value}))} min="2" max="52"/></div>
            </div>
            {form.totalAmount&&form.splits&&(
              <div style={{background:'var(--accent-light)',borderRadius:8,padding:'8px 12px',fontSize:12,color:'var(--accent)',marginBottom:10}}>
                회당 금액: <strong>{fmtKRW(Math.round(parseFloat(form.totalAmount)/parseInt(form.splits)))}</strong>
              </div>
            )}
            <button className="btn btn-primary w100" onClick={calc}>📅 스케줄 생성</button>
          </div>

          {/* 리밸런싱 */}
          <div className="card">
            <div className="section-title mb14">📊 리밸런싱 제안</div>
            {rows.map(r=>{
              if(Math.abs(r.diff)<1.5)return null;
              return(
                <div key={r.id} className="flexb" style={{padding:'7px 0',borderBottom:'1px solid var(--border)'}}>
                  <div className="flex gap8">
                    <span className="ticker-chip">{r.ticker}</span>
                    <span style={{fontSize:12}}>{r.name}</span>
                  </div>
                  <div className="flex gap8">
                    <span className={`badge ${r.diff>0?'badge-up':'badge-down'}`}>{r.diff>0?'과다':'부족'} {Math.abs(r.diff).toFixed(1)}%</span>
                    <span style={{fontSize:10,color:'var(--text3)'}}>{r.diff>0?'→ 매도':'→ 매수'}</span>
                  </div>
                </div>
              );
            })}
            {rows.every(r=>Math.abs(r.diff)<1.5)&&<div style={{color:'var(--text3)',fontSize:12,textAlign:'center',padding:12}}>✅ 포트폴리오 균형 양호</div>}
          </div>
        </div>

        <div className="card">
          <div className="section-title mb14">{plan?`${plan.mode==='buy'?'분할매수':'분할매도'} 스케줄 (${plan.count}회)`:'스케줄'}</div>
          {plan?(
            <>
              <div style={{background:'var(--accent-light)',borderRadius:8,padding:'10px 12px',marginBottom:12}}>
                <div className="flexb"><span style={{fontSize:11}}>회당</span><span className="mono" style={{fontWeight:700}}>{fmtKRW(plan.amtEach)}</span></div>
                <div className="flexb mt8"><span style={{fontSize:11}}>총액</span><span className="mono" style={{fontWeight:700}}>{fmtKRW(plan.total)}</span></div>
              </div>
              <div style={{maxHeight:400,overflowY:'auto'}}>
                {plan.rows.map(r=>(
                  <div key={r.n} className="split-row">
                    <div className="split-num">{r.n}</div>
                    <div className="mono" style={{fontSize:11}}>{r.date}</div>
                    <div style={{textAlign:'right'}}>
                      <div className="mono" style={{fontWeight:700,fontSize:12}}>{fmtKRW(r.amount)}</div>
                      {r.estQty!=='-'&&<div style={{fontSize:9,color:'var(--text3)'}}>≈{r.estQty}주</div>}
                    </div>
                    <div style={{textAlign:'right',fontSize:10,color:'var(--text3)'}}>{r.note}</div>
                  </div>
                ))}
              </div>
            </>
          ):(
            <div style={{textAlign:'center',padding:'48px 0',color:'var(--text3)'}}>
              <div style={{fontSize:32,marginBottom:8}}>📅</div>
              <div style={{fontSize:12}}>왼쪽에서 조건 입력 후 생성하세요</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// 거래내역
// ════════════════════════════════════════════════════
function History({history,setHistory}){
  const [showModal,setShowModal]=useState(false);
  const [form,setForm]=useState({date:today_(),ticker:'',name:'',type:'buy',amount:'',price:'',fee:'',note:''});
  const [filter,setFilter]=useState('all');
  const [search,setSearch]=useState('');

  const save=()=>{
    if(!form.ticker||!form.amount)return;
    const amt=parseFloat(form.amount)||0;
    const price=parseFloat(form.price)||0;
    const qty=price>0?amt/price:1;
    setHistory(h=>[{...form,id:Date.now(),amount:amt,price,qty,fee:parseFloat(form.fee)||0},...h]);
    setShowModal(false);
    setForm({date:today_(),ticker:'',name:'',type:'buy',amount:'',price:'',fee:'',note:''});
  };

  const del=id=>{if(confirm('삭제?'))setHistory(h=>h.filter(x=>x.id!==id));};

  const filtered=[...history]
    .filter(h=>filter==='all'||h.type===filter)
    .filter(h=>!search||h.ticker.includes(search.toUpperCase())||h.name.includes(search))
    .sort((a,b)=>b.date.localeCompare(a.date));

  const monthly={};
  history.forEach(h=>{const m=h.date.slice(0,7);if(!monthly[m])monthly[m]={buy:0,sell:0,deposit:0,fee:0,count:0};monthly[m][h.type]=(monthly[m][h.type]||0)+h.amount;monthly[m].fee+=h.fee||0;monthly[m].count++;});
  const monthKeys=Object.keys(monthly).sort().reverse().slice(0,3);

  return(
    <div className="page">
      <div className="g3 mb14">
        {monthKeys.map(m=>(
          <div key={m} className="card">
            <div className="card-title">{m}</div>
            <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
              <div><div style={{fontSize:10,color:'var(--text3)'}}>매수</div><div className="up mono" style={{fontSize:13}}>{fmtKRW(monthly[m].buy)}</div></div>
              <div><div style={{fontSize:10,color:'var(--text3)'}}>매도</div><div className="down mono" style={{fontSize:13}}>{fmtKRW(monthly[m].sell)}</div></div>
              {monthly[m].deposit>0&&<div><div style={{fontSize:10,color:'var(--text3)'}}>납입</div><div className="mono" style={{fontSize:13,color:'var(--gold)'}}>{fmtKRW(monthly[m].deposit)}</div></div>}
              <div><div style={{fontSize:10,color:'var(--text3)'}}>수수료</div><div className="mono" style={{fontSize:13}}>{fmtKRW(monthly[m].fee)}</div></div>
            </div>
          </div>
        ))}
      </div>

      <div className="card">
        <div className="flexb mb14" style={{flexWrap:'wrap',gap:8}}>
          <div className="flex gap8" style={{flexWrap:'wrap'}}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="티커/종목명 검색" style={{width:140}}/>
            {['all','buy','sell','deposit'].map(t=>(
              <button key={t} className={`btn ${filter===t?'btn-primary':'btn-secondary'} btn-sm`} onClick={()=>setFilter(t)}>
                {t==='all'?'전체':t==='buy'?'매수':t==='sell'?'매도':'입금'}
              </button>
            ))}
          </div>
          <button className="btn btn-primary" onClick={()=>setShowModal(true)}>+ 거래 추가</button>
        </div>
        <div className="tbl-wrap">
          <table>
            <thead><tr><th>날짜</th><th>종목</th><th>구분</th><th className="tr">금액</th><th className="tr">단가</th><th className="tr">수량</th><th className="tr">수수료</th><th>메모</th><th></th></tr></thead>
            <tbody>
              {filtered.map(r=>(
                <tr key={r.id}>
                  <td className="mono" style={{fontSize:11}}>{r.date}</td>
                  <td><div style={{fontWeight:600,fontSize:12}}>{r.name}</div><div style={{fontSize:10,color:'var(--text3)'}}>{r.ticker}</div></td>
                  <td><span className={`hbadge h${r.type}`}>{r.type==='buy'?'매수':r.type==='sell'?'매도':'입금'}</span></td>
                  <td className="tr mono" style={{fontWeight:700}}>{fmtKRW(r.amount)}</td>
                  <td className="tr mono">{r.price?fmtKRW(r.price):'-'}</td>
                  <td className="tr mono">{r.type!=='deposit'?fmt(r.qty,4):'-'}</td>
                  <td className="tr mono" style={{fontSize:11,color:'var(--text3)'}}>{r.fee?fmtKRW(r.fee):'-'}</td>
                  <td style={{fontSize:11,color:'var(--text3)'}}>{r.note||'-'}</td>
                  <td><button className="btn btn-danger btn-sm" onClick={()=>del(r.id)}>삭제</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {showModal&&(
        <Modal title="거래내역 추가" onClose={()=>setShowModal(false)}>
          <div className="form-row">
            <div className="form-group"><label>날짜</label><input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>
            <div className="form-group"><label>구분</label>
              <select value={form.type} onChange={e=>setForm(f=>({...f,type:e.target.value}))}>
                <option value="buy">매수</option><option value="sell">매도</option><option value="deposit">입금/납입</option>
              </select>
            </div>
          </div>
          <div className="form-row">
            <div className="form-group">
              <label>티커</label>
              <TickerInput value={form.ticker} onChange={v=>setForm(f=>({...f,ticker:v}))} onSelect={(k,v)=>setForm(f=>({...f,ticker:k,name:v.name}))}/>
            </div>
            <div className="form-group"><label>종목명</label><input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="자동입력"/></div>
          </div>
          <div className="form-row">
            <div className="form-group"><label>투자금액 (₩)</label><input type="number" value={form.amount} onChange={e=>setForm(f=>({...f,amount:e.target.value}))} placeholder="1000000"/></div>
            <div className="form-group"><label>단가 (₩)</label><input type="number" value={form.price} onChange={e=>setForm(f=>({...f,price:e.target.value}))} placeholder="선택"/></div>
            <div className="form-group"><label>수수료 (₩)</label><input type="number" value={form.fee} onChange={e=>setForm(f=>({...f,fee:e.target.value}))}/></div>
          </div>
          <div className="form-group mb14"><label>메모</label><input value={form.note} onChange={e=>setForm(f=>({...f,note:e.target.value}))} placeholder="분할매수 1회차 등"/></div>
          <div className="flex gap8">
            <button className="btn btn-primary w100" onClick={save}>추가</button>
            <button className="btn btn-secondary" onClick={()=>setShowModal(false)}>취소</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// 업로드
// ════════════════════════════════════════════════════
function Upload({setHistory}){
  const [drag,setDrag]=useState(false);
  const [result,setResult]=useState(null);
  const fileRef=useRef();

  const parseCSV=text=>{
    const lines=text.trim().split('\n');
    return lines.slice(1).map((line,i)=>{
      const cols=line.split(',').map(c=>c.trim().replace(/"/g,''));
      const [date,desc,amount,balance]=cols;
      const amt=parseFloat((amount||'').replace(/[^0-9.-]/g,''))||0;
      return{id:Date.now()+i,date:(date||today_()).slice(0,10),ticker:'CASH',name:desc||'토스 거래',type:amt>0?'deposit':'buy',qty:1,price:Math.abs(amt),amount:Math.abs(amt),fee:0,note:'토스뱅크'};
    }).filter(r=>r.amount>0);
  };

  const handleFile=file=>{
    if(!file)return;
    const reader=new FileReader();
    reader.onload=e=>{
      const rows=parseCSV(e.target.result);
      setResult({name:file.name,count:rows.length,rows});
    };
    reader.readAsText(file,'utf-8');
  };

  const confirm_=()=>{if(!result)return;setHistory(h=>[...result.rows,...h]);setResult(null);alert(`${result.count}건 추가 완료!`);};

  return(
    <div className="page">
      <div className="g2">
        <div>
          <div className="card mb14">
            <div className="section-title mb14">📂 거래내역서 업로드</div>
            <div className={`upload-area ${drag?'drag':''}`}
              onDragOver={e=>{e.preventDefault();setDrag(true)}} onDragLeave={()=>setDrag(false)}
              onDrop={e=>{e.preventDefault();setDrag(false);handleFile(e.dataTransfer.files[0])}}
              onClick={()=>fileRef.current.click()}>
              <div style={{fontSize:36,marginBottom:10}}>📄</div>
              <div style={{fontWeight:600,color:'var(--text2)'}}>파일 드래그 또는 클릭</div>
              <div style={{fontSize:11,color:'var(--text3)',marginTop:4}}>CSV, Excel, PDF 지원</div>
              <input ref={fileRef} type="file" accept=".csv,.xlsx,.pdf" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])}/>
            </div>
          </div>
          <div className="card">
            <div style={{fontWeight:700,fontSize:13,marginBottom:10}}>📱 토스뱅크 내보내기 방법</div>
            <ol style={{paddingLeft:18,fontSize:12,color:'var(--text2)',lineHeight:2.2}}>
              <li>토스뱅크 앱 실행</li>
              <li>계좌 선택 → 오른쪽 상단 <strong>[···]</strong></li>
              <li><strong>[거래내역 내보내기]</strong> 탭</li>
              <li>기간 선택 후 <strong>CSV</strong>로 저장</li>
              <li>위 영역에 파일 업로드</li>
            </ol>
          </div>
        </div>
        <div className="card">
          <div className="section-title mb14">미리보기</div>
          {result?(
            <>
              <div style={{background:'var(--accent-light)',borderRadius:8,padding:'10px 12px',marginBottom:12}}>
                <div style={{fontWeight:700}}>{result.name}</div>
                <div style={{fontSize:12,color:'var(--text2)',marginTop:4}}>{result.count}건 파싱 완료</div>
              </div>
              <div className="tbl-wrap" style={{maxHeight:320,overflowY:'auto'}}>
                <table>
                  <thead><tr><th>날짜</th><th>내역</th><th className="tr">금액</th></tr></thead>
                  <tbody>
                    {result.rows.slice(0,30).map((r,i)=>(
                      <tr key={i}>
                        <td className="mono" style={{fontSize:11}}>{r.date}</td>
                        <td style={{fontSize:11}}>{r.name}</td>
                        <td className="tr mono">{fmtKRW(r.amount)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div className="flex gap8 mt8">
                <button className="btn btn-primary w100" onClick={confirm_}>거래내역에 추가</button>
                <button className="btn btn-secondary" onClick={()=>setResult(null)}>취소</button>
              </div>
            </>
          ):(
            <div style={{textAlign:'center',padding:'60px 0',color:'var(--text3)'}}>
              <div style={{fontSize:40,marginBottom:10}}>⬆️</div>
              <div style={{fontSize:12}}>파일을 업로드하면 미리보기가 표시됩니다</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// 설정
// ════════════════════════════════════════════════════
function Settings({exchRate,setExchRate,holdings,history,setHoldings,setHistory}){
  const exportData=()=>{
    const blob=new Blob([JSON.stringify({holdings,history,exchRate,exportDate:new Date().toISOString()},null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`folio_${today_()}.json`;a.click();
  };
  const importData=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(d.holdings)setHoldings(d.holdings);
        if(d.history)setHistory(d.history);
        if(d.exchRate)setExchRate(d.exchRate);
        alert('데이터 복원 완료!');
      }catch{alert('파일 오류');}
    };
    reader.readAsText(file);
  };
  const reset=()=>{if(confirm('모든 데이터를 초기화하시겠어요?')){setHoldings([]);setHistory([]);localStorage.clear();}};
  const importRef=useRef();

  return(
    <div className="page">
      <div className="g2">
        <div className="card">
          <div className="section-title mb14">⚙️ 기본 설정</div>
          <div className="form-group mb14">
            <label>USD/KRW 환율 (수동)</label>
            <div className="input-wrap">
              <input type="number" value={exchRate} onChange={e=>setExchRate(parseFloat(e.target.value)||1400)}/>
              <span className="input-suffix">₩</span>
            </div>
          </div>
          <div style={{fontSize:11,color:'var(--text3)',background:'var(--bg2)',padding:12,borderRadius:8,lineHeight:1.8}}>
            💡 실시간 환율은 시장 지표 탭에서 확인하세요 (USD/KRW)<br/>
            포트폴리오 원화 환산에는 위 수동 환율이 사용됩니다
          </div>
        </div>
        <div className="card">
          <div className="section-title mb14">💾 데이터 관리</div>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            <button className="btn btn-primary" onClick={exportData}>📥 백업 (JSON 내보내기)</button>
            <button className="btn btn-secondary" onClick={()=>importRef.current.click()}>📤 복원 (JSON 가져오기)</button>
            <input ref={importRef} type="file" accept=".json" style={{display:'none'}} onChange={importData}/>
            <div style={{fontSize:11,color:'var(--text3)',lineHeight:1.8,background:'var(--bg2)',padding:12,borderRadius:8}}>
              보유종목: <strong>{holdings.length}개</strong> · 거래내역: <strong>{history.length}건</strong><br/>
              데이터는 브라우저 localStorage에 자동 저장됩니다<br/>
              정기적으로 JSON 백업을 권장합니다
            </div>
            <button className="btn btn-danger" onClick={reset}>🗑️ 전체 초기화</button>
          </div>
        </div>
      </div>
      <div className="card mt8">
        <div className="section-title mb14">📱 모바일에서 사용하기 (GitHub Pages)</div>
        <ol style={{paddingLeft:18,fontSize:12,color:'var(--text2)',lineHeight:2.2}}>
          <li>GitHub 계정 생성 (github.com)</li>
          <li>새 Repository 생성 (예: <code>my-portfolio</code>)</li>
          <li><strong>portfolio-app.html</strong> 파일 업로드 → <strong>index.html</strong>로 이름 변경</li>
          <li>Settings → Pages → Branch: main 설정</li>
          <li><strong>https://[아이디].github.io/my-portfolio</strong> 로 폰에서 접속!</li>
        </ol>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════
// 메인 앱
// ════════════════════════════════════════════════════
function App(){
  const [tab,setTab]=useState('dashboard');
  const [holdings,setHoldings_]=useState(()=>load('holdings',INIT_HOLDINGS));
  const [history,setHistory_]=useState(()=>load('history',INIT_HISTORY));
  const [exchRate,setExchRate_]=useState(()=>load('exchRate',1385));
  const [prices,setPrices]=useState({});
  const [time,setTime]=useState(nowStr());

  const setHoldings=fn=>{const next=typeof fn==='function'?fn(holdings):fn;setHoldings_(next);save('holdings',next);};
  const setHistory=fn=>{const next=typeof fn==='function'?fn(history):fn;setHistory_(next);save('history',next);};
  const setExchRate=v=>{setExchRate_(v);save('exchRate',v);};

  // 보유종목 주가 자동 조회
  useEffect(()=>{
    const tickers=[...new Set(holdings.map(h=>h.ticker))];
    if(!tickers.length)return;
    fetchMultiplePrices(tickers).then(setPrices);
    const t=setInterval(()=>fetchMultiplePrices(tickers).then(setPrices),120000);
    return()=>clearInterval(t);
  },[holdings.map(h=>h.ticker).join(',')]);

  // 시계
  useEffect(()=>{const t=setInterval(()=>setTime(nowStr()),30000);return()=>clearInterval(t);},[]);

  // 마켓바 데이터 + 환율 자동 적용
  const [barData,setBarData]=useState({});
  useEffect(()=>{
    const tickers=['SPY','QQQ','%5EKS11','%5EKQ11','%5EVIX','USDKRW%3DX','GC%3DF','CL%3DF'];
    const fetchAndApply=()=>fetchMultiplePrices(tickers).then(d=>{
      setBarData(d);
      const krw=d['USDKRW%3DX']?.price;
      if(krw&&krw>100){setExchRate_(Math.round(krw));save('exchRate',Math.round(krw));}
    });
    fetchAndApply();
    const t=setInterval(fetchAndApply,60000);
    return()=>clearInterval(t);
  },[]);

  const BAR_ITEMS=[
    {label:'S&P500',ticker:'SPY'},{label:'나스닥',ticker:'QQQ'},
    {label:'코스피',ticker:'%5EKS11'},{label:'코스닥',ticker:'%5EKQ11'},
    {label:'VIX',ticker:'%5EVIX'},{label:'USD/KRW',ticker:'USDKRW%3DX'},
    {label:'금',ticker:'GC%3DF'},{label:'WTI',ticker:'CL%3DF'},
  ];

  const TABS=[
    {id:'dashboard',label:'📊 대시보드'},
    {id:'market',label:'🌐 시장지표'},
    {id:'portfolio',label:'💼 포트폴리오'},
    {id:'split',label:'📅 분할계획'},
    {id:'history',label:'📋 거래내역'},
    {id:'upload',label:'📂 업로드'},
    {id:'settings',label:'⚙️ 설정'},
  ];

  // 마켓바 아이템 2배 복제 (무한 스크롤)
  const barItems=[...BAR_ITEMS,...BAR_ITEMS].map((item,i)=>{
    const d=barData[item.ticker];
    const chg=d?((d.price-d.prev)/d.prev*100):null;
    return(
      <div key={i} className="market-item">
        <span className="market-name">{item.label}</span>
        {d?(
          <>
            <span className="market-val" style={{color:chg>=0?'var(--up)':'var(--down)'}}>{fmt(d.price,item.ticker==='USDKRW%3DX'?0:2)}</span>
            <span className="market-chg" style={{color:chg>=0?'var(--up)':'var(--down)'}}>{chg>=0?'▲':'▼'}{Math.abs(chg).toFixed(2)}%</span>
          </>
        ):(
          <span style={{color:'var(--text3)',fontSize:10}}>로딩중</span>
        )}
      </div>
    );
  });

  return(
    <>
      <nav className="nav">
        <div className="nav-top">
          <div className="nav-logo">Folio</div>
          <div className="nav-spacer"/>
          <div className="nav-time">{time}</div>
        </div>
        <div className="nav-tabs">
          {TABS.map(t=>(
            <button key={t.id} className={`nav-tab ${tab===t.id?'active':''}`} onClick={()=>setTab(t.id)}>{t.label}</button>
          ))}
        </div>
      </nav>
      <div className="market-bar">
        <div className="market-scroll">{barItems}</div>
      </div>
      {tab==='dashboard'&&<Dashboard holdings={holdings} history={history} prices={prices} exchRate={exchRate}/>}
      {tab==='market'&&<MarketPage/>}
      {tab==='portfolio'&&<Portfolio holdings={holdings} setHoldings={setHoldings} prices={prices} exchRate={exchRate}/>}
      {tab==='split'&&<SplitPlan holdings={holdings} prices={prices}/>}
      {tab==='history'&&<History history={history} setHistory={setHistory}/>}
      {tab==='upload'&&<Upload setHistory={setHistory}/>}
      {tab==='settings'&&<Settings exchRate={exchRate} setExchRate={setExchRate} holdings={holdings} history={history} setHoldings={setHoldings} setHistory={setHistory}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
